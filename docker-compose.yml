# Local development infrastructure.
#   docker compose up -d postgres redis     # just the dependencies (typical)
#   docker compose up --build backend       # full stack incl. the API
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bigant
      POSTGRES_PASSWORD: bigant
      POSTGRES_DB: bigant_logistics
    # Host 5433 → container 5432, to avoid clashing with a local Postgres on 5432.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bigant -d bigant_logistics']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://bigant:bigant@postgres:5432/bigant_logistics?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_TTL: 30d
      CORS_ORIGINS: http://localhost:5173
      SEED_ADMIN_NAME: System Admin
      SEED_ADMIN_PHONE: '+998900000000'
      SEED_ADMIN_PASSWORD: admin12345
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  pgdata:
