plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'uz.bigant'
version = '1.0.0'

android {
  namespace "expo.modules.gpsguard"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.6.0"
  // Google's one-tap "turn on location" sheet; the same version expo-location brings.
  implementation "com.google.android.gms:play-services-location:21.0.1"
}
