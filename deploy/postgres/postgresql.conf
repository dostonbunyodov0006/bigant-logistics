# Postgres configuration for the production box (8 vCPU / 24 GB / SSD).
# Passed as `config_file=` by docker-compose.prod.yml, which REPLACES the config
# the image generates at initdb — so anything needed at runtime must be set here,
# not just the tuning. Stock defaults ship shared_buffers=128MB, which would
# leave almost all of the RAM unused.
#
# Budget: Postgres is sized for ~8 GB of the 24 GB, leaving room for the Node
# process, nginx and page cache.
#
# hba_file and ident_file are intentionally not set: they default to the ones
# initdb wrote into the data directory, which carry the image's auth rules.

# --- Connectivity ---
# Required. The image's generated config sets this; overriding config_file drops
# it, and the default (localhost) would make the container unreachable from the
# backend over the compose network.
listen_addresses = '*'
port = 5432

# --- Memory ---
shared_buffers = 6GB
# Not an allocation — it tells the planner how much OS cache it can assume,
# which is what makes it prefer index scans over sequential ones.
effective_cache_size = 16GB
maintenance_work_mem = 1GB
work_mem = 32MB

# --- Connections ---
# Prisma's pool defaults to (cores * 2 + 1); this leaves ample headroom for it
# plus psql sessions and pg_dump.
max_connections = 100

# --- SSD-aware planning ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Write-ahead log / checkpoints ---
wal_compression = on
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# --- Parallelism (8 vCPU) ---
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- Observability ---
# Anything slower than half a second is worth seeing; the app's own queries are
# all indexed and should be far under this.
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# --- Time ---
# Must stay UTC. The application derives Tashkent local time itself (see
# common/tashkent-time.ts, UTC+5 with no DST); a non-UTC server timezone would
# double-apply the offset and corrupt attendance date keys.
timezone = 'UTC'
